<!-- Enkelval -->
<h1>Yrkesväljaren enkelval</h1>
<yrkes-valjaren
  yv-label="Sök och välj ett yrke"
  (yrkesvaljareSelection)="handleSelection($event)"
>
</yrkes-valjaren>
<pre>Mottagen data från yrkesvaljareSelection:
{{ singleSelectionResult }}</pre>

<hr style="margin: 2rem 0; border: 1px solid #e9ecef;">

<!-- Flerval -->
<h1>Yrkesväljaren flerval</h1>
<yrkes-valjaren
  #multiSelect
  yv-label="Välj ett eller flera yrken"
  yv-enable-multiple="true"
  (yrkesvaljareSelection)="handleMultiSelection($event)"
>
</yrkes-valjaren>
<pre>Mottagen data från yrkesvaljareSelection:
{{ multiSelectionResult }}</pre>
<br>
<button (click)="setPreselected()">Sätt till 'Läkare' och 'Sjuksköterska'</button>
<button (click)="clearSelection()">Rensa val</button>
