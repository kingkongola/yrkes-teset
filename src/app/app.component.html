<div class="app-background"></div>

<div class="app-container">
  <header class="app-header">
    <div class="logo-container">
      <div class="logo-icon">AF</div>
      <div class="logo-text">
        <span class="brand">Arbetsförmedlingen</span>
        <span class="version">YV + KV</span>
      </div>
    </div>
    <h1 class="page-title">Yrkesväljaren till Kompetensväljaren</h1>
  </header>

  <div class="main-grid">
    <section class="glass-card">
      <div class="card-header">
        <h2>Välj yrke eller yrken</h2>
        <span class="badge">YV flerval</span>
      </div>

      <yrkes-valjaren
        #multiSelect
        yv-label="Välj ett eller flera yrken"
        yv-enable-multiple="true"
        (yrkesvaljareSelection)="handleMultiSelection($event)"
      >
      </yrkes-valjaren>

      <div class="result-display">
        <span class="result-label">YV-resultat</span>
        <div class="code-block">{{ multiSelectionResult }}</div>
      </div>

      <div class="action-bar">
        <button class="btn btn-primary" (click)="setPreselected()">
          <span>Sätt exempelval</span>
        </button>
        <button class="btn btn-secondary" (click)="clearSelection()">
          <span>Rensa</span>
        </button>
      </div>
    </section>

    <section class="glass-card">
      <div class="card-header">
        <h2>Välj kompetenser</h2>
        <span class="badge glow">KV</span>
      </div>

      <div class="result-display">
        <span class="result-label">KV-kontext</span>
        <div class="code-block">{{ contextSummary }}</div>
      </div>

      <div class="result-display">
        <span class="result-label">Rekommenderade kompetenser</span>
        <div class="code-block">{{ popularSummary }}</div>
      </div>

      <digi-service-skill-selector
        af-label="Sök och välj kompetenser"
        [attr.af-occupation-id]="selectedOccupationId || null"
        [attr.af-input-ids]="selectedInputIds || null"
        [attr.af-popular]="showPopular ? 'true' : 'false'"
        (afKompetensSelection)="handleSkillSelection($event)"
      >
      </digi-service-skill-selector>

      <div class="result-display">
        <span class="result-label">KV-resultat</span>
        <div class="code-block">{{ skillSelectionResult }}</div>
      </div>
    </section>
  </div>
</div>
